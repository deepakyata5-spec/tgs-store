<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE GILD SERPENT ® | ADDICTIVE EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');

        :root {
            --brand-gold: #D4AF37;
            --brand-gold-glow: rgba(212, 175, 55, 0.6);
            --brand-emerald: #00C957;
            --brand-emerald-glow: rgba(0, 201, 87, 0.6);
            --brand-red: #C40233;
            --bg-dark: #050505;
        }

        body {
            background-color: var(--bg-dark);
            color: #eaeaea;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            touch-action: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #050505;
        }

        .game-wrapper {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 201, 87, 0.1), 0 0 20px rgba(212, 175, 55, 0.05);
            border-radius: 24px;
            padding: 4px;
            background: linear-gradient(145deg, #1a1a1a, #000);
        }

        canvas {
            background: radial-gradient(circle at center, #111 0%, #030303 100%);
            display: block;
            width: 90vw; 
            height: 90vw;
            max-width: 550px;
            max-height: 550px;
            border-radius: 20px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
        }

        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(10px);
            z-index: 20;
            border-radius: 20px;
            transition: opacity 0.3s ease;
        }

        .hidden { opacity: 0; pointer-events: none; }

        h1 {
            font-weight: 800;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 25px var(--brand-gold-glow);
            text-align: center;
        }

        /* Mode Selection Buttons */
        .btn-mode {
            background: rgba(20, 20, 20, 0.8);
            color: var(--brand-gold);
            padding: 14px 20px;
            border: 1px solid var(--brand-gold);
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: all 0.2s;
            width: 100%;
        }
        .btn-mode:active { transform: scale(0.95); background: #111; }
        
        .btn-mode-special {
            background: linear-gradient(135deg, #005c28, #00C957);
            color: #fff;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--brand-emerald-glow);
            animation: pulse-emerald 2s infinite;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-mode-special:active { transform: scale(0.95); }

        @keyframes pulse-emerald {
            0% { box-shadow: 0 0 15px var(--brand-emerald-glow); }
            50% { box-shadow: 0 0 30px var(--brand-emerald-glow), 0 0 10px #fff; }
            100% { box-shadow: 0 0 15px var(--brand-emerald-glow); }
        }

        /* Premium Store Button */
        .btn-shop {
            background: #0a0a0a;
            color: var(--brand-gold);
            width: 85%;
            max-width: 400px;
            padding: 18px 20px;
            border-radius: 20px;
            border: 2px solid var(--brand-gold);
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px var(--brand-gold-glow);
            transition: all 0.2s ease;
        }
        
        .btn-shop:active { transform: scale(0.98); background: #111; }

        .btn-shop .main-text {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .btn-shop .sub-text {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 4px;
            color: var(--brand-emerald);
        }

        /* D-PAD */
        .d-pad {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px;
            gap: 10px;
        }
        .d-btn {
            width: 70px; height: 70px;
            background: rgba(25, 25, 25, 0.8);
            border-radius: 22px;
            color: #555;
            font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.1s;
            border: 1px solid #222;
        }
        .d-btn:active { 
            background: var(--brand-gold);
            color: #000;
            transform: scale(0.9);
            box-shadow: 0 0 20px var(--brand-gold-glow);
        }
    </style>
</head>
<body>

    <div class="flex justify-between w-[90vw] max-w-[550px] mb-3 font-semibold text-sm tracking-widest uppercase">
        <span class="text-gray-400">Score: <span id="scoreVal" class="text-white text-lg ml-1">0</span></span>
        <span class="text-gray-400">Mode: <span id="modeVal" class="text-[#D4AF37] text-sm ml-1">NORMAL</span></span>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="800" height="800"></canvas>

        <div id="startScreen" class="ui-layer">
            <h1 class="text-5xl mb-2 leading-tight">THE GILD<br>SERPENT</h1>
            <p class="text-[0.65rem] text-[#D4AF37] mb-8 tracking-[0.5em] font-semibold uppercase">Select Mode</p>
            
            <div class="flex flex-col gap-4 w-3/4 max-w-[260px]">
                <button class="btn-mode" onclick="startGame('normal')">NORMAL SPEED</button>
                <button class="btn-mode" onclick="startGame('fast')">FAST SPEED</button>
                <button class="btn-mode-special" onclick="startGame('offer')">OFFER MODE</button>
            </div>
        </div>

        <div id="gameOverScreen" class="ui-layer hidden">
            <p id="modeResultText" class="text-[0.65rem] text-[#D4AF37] mb-1 tracking-[0.4em] font-bold uppercase hidden">Offer Mode Played</p>
            <h1 id="gameOverTitle" class="text-4xl mb-2 text-[#C40233]" style="text-shadow: 0 0 20px rgba(196,2,51,0.5);">GAME OVER</h1>
            
            <p class="text-sm text-gray-300 mb-2 font-semibold tracking-widest uppercase">Items Collected: <span id="finalScore" class="text-white text-xl ml-1">0</span></p>
            
            <!-- Dynamic Offer Display -->
            <div id="offerResultDisplay" class="hidden mb-4 mt-2"></div>
            
            <button class="btn-shop mb-5 mt-2" onclick="window.location.href='https://share.google/MDpaPcYIcEusIODQA'">
                <span class="main-text">CLAIM AT STORE</span>
                <span class="sub-text">1st Floor • Bhuvanagiri</span>
            </button>
            
            <button class="text-sm font-semibold text-gray-500 hover:text-[#D4AF37] transition-colors tracking-widest uppercase border-b border-transparent hover:border-[#D4AF37] pb-1" onclick="showMenu()">MAIN MENU</button>
        </div>
    </div>

    <div class="d-pad sm:hidden">
        <div></div><div class="d-btn" id="btn-up" ontouchstart="handleInput('up', event)">▲</div><div></div>
        <div class="d-btn" id="btn-left" ontouchstart="handleInput('left', event)">◀</div>
        <div class="d-btn" id="btn-down" ontouchstart="handleInput('down', event)">▼</div>
        <div class="d-btn" id="btn-right" ontouchstart="handleInput('right', event)">▶</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_COUNT = 16; 
        const TILE_SIZE = canvas.width / GRID_COUNT; 
        
        let snake = [];
        let food = {}; 
        let velocity = {x: 0, y: 0};
        let nextVelocity = {x: 0, y: 0};
        let score = 0;
        let lastTime = 0;
        let moveTimer = 0;
        
        let currentMode = 'normal';
        let moveInterval = 155; 
        
        let isRunning = false;
        let frameCount = 0;
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if(type === 'eat') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start();
                osc.stop(now + 0.1);
            } else { 
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start();
                osc.stop(now + 0.3);
            }
        }

        function showMenu() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        }

        function startGame(mode) {
            currentMode = mode;
            snake = [{x: 5, y: 8}, {x: 4, y: 8}, {x: 3, y: 8}];
            velocity = {x: 1, y: 0};
            nextVelocity = {x: 1, y: 0};
            score = 0;
            
            if (currentMode === 'fast') {
                moveInterval = 100;
                document.getElementById('modeVal').innerText = "FAST";
            } else if (currentMode === 'offer') {
                moveInterval = 140; 
                document.getElementById('modeVal').innerText = "OFFER";
                document.getElementById('modeVal').className = "text-[#00C957] text-sm ml-1 animate-pulse";
            } else {
                moveInterval = 155; 
                document.getElementById('modeVal').innerText = "NORMAL";
                document.getElementById('modeVal').className = "text-[#D4AF37] text-sm ml-1";
            }

            document.getElementById('scoreVal').innerText = "0";
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            
            placeFood();
            isRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
            if(audioCtx.state === 'suspended') audioCtx.resume();
        }

        function placeFood() {
            let valid = false;
            while(!valid) {
                food = {
                    x: Math.floor(Math.random() * GRID_COUNT),
                    y: Math.floor(Math.random() * GRID_COUNT),
                    type: Math.random() > 0.5 ? 'shirt' : 'pant'
                };
                valid = !snake.some(part => part.x === food.x && part.y === food.y);
            }
        }

        function gameOver() {
            isRunning = false;
            playSound('die');
            document.getElementById('finalScore').innerText = score;
            
            const offerDisplay = document.getElementById('offerResultDisplay');
            const goTitle = document.getElementById('gameOverTitle');
            const modeResultText = document.getElementById('modeResultText');
            
            if (currentMode === 'offer') {
                modeResultText.classList.remove('hidden');
                offerDisplay.classList.remove('hidden');
                
                if (score >= 5) {
                    let discount = Math.min(score, 50); // Cap at 50%
                    
                    // Transform Game Over into a positive Result
                    goTitle.innerText = "PROMO UNLOCKED";
                    goTitle.className = "text-4xl mb-1 text-[#00C957] animate-pulse";
                    goTitle.style.textShadow = "0 0 20px rgba(0,201,87,0.5)";
                    
                    offerDisplay.innerHTML = `<span class="text-4xl font-black text-[#D4AF37]" style="text-shadow: 0 0 15px rgba(212,175,55,0.8);">${discount}% OFF</span><br><span class="text-xs text-white tracking-widest uppercase">Next Instore Purchase</span>`;
                    offerDisplay.className = "text-center";
                } else {
                    goTitle.innerText = "GAME OVER";
                    goTitle.className = "text-4xl mb-2 text-[#C40233]";
                    goTitle.style.textShadow = "0 0 20px rgba(196,2,51,0.5)";
                    
                    offerDisplay.innerHTML = `COLLECT 5+ ITEMS TO<br>UNLOCK A DISCOUNT`;
                    offerDisplay.className = "text-xs text-gray-400 font-semibold tracking-widest uppercase text-center";
                }
            } else {
                modeResultText.classList.add('hidden');
                offerDisplay.classList.add('hidden');
                
                // Standard Game Over
                goTitle.innerText = "GAME OVER";
                goTitle.className = "text-4xl mb-2 text-[#C40233]";
                goTitle.style.textShadow = "0 0 20px rgba(196,2,51,0.5)";
            }

            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function gameLoop(currentTime) {
            if(!isRunning) return;
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            moveTimer += deltaTime;
            frameCount++;

            if(moveTimer > moveInterval) {
                moveTimer = 0;
                updateSnake();
            }

            render();
            requestAnimationFrame(gameLoop);
        }

        function updateSnake() {
            velocity = nextVelocity;
            const head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

            if(head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT) {
                gameOver(); return;
            }
            if(snake.some(part => part.x === head.x && part.y === head.y)) {
                gameOver(); return;
            }

            snake.unshift(head);

            if(head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById('scoreVal').innerText = score;
                playSound('eat');
                placeFood();
                
                if (currentMode === 'normal') {
                    if (moveInterval > 110) moveInterval -= 4.5;
                    else if (moveInterval > 75) moveInterval -= 2.5;
                    else if (moveInterval > 55) moveInterval -= 1;
                } else if (currentMode === 'fast') {
                    if (moveInterval > 80) moveInterval -= 4;
                    else if (moveInterval > 45) moveInterval -= 1.5; 
                } else if (currentMode === 'offer') {
                    if (moveInterval > 70) moveInterval -= 2; 
                }
                
            } else {
                snake.pop();
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawClothing(food.x, food.y, food.type);

            if (snake.length > 0) {
                ctx.save();
                
                ctx.beginPath();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                ctx.moveTo(snake[0].x * TILE_SIZE + TILE_SIZE/2, snake[0].y * TILE_SIZE + TILE_SIZE/2);
                for (let i = 1; i < snake.length; i++) {
                    ctx.lineTo(snake[i].x * TILE_SIZE + TILE_SIZE/2, snake[i].y * TILE_SIZE + TILE_SIZE/2);
                }

                ctx.shadowBlur = 25;
                ctx.shadowColor = '#00C957';
                ctx.lineWidth = TILE_SIZE * 0.85; 
                ctx.strokeStyle = '#005c28';
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.lineWidth = TILE_SIZE * 0.6;
                ctx.strokeStyle = '#00C957';
                ctx.stroke();

                ctx.lineWidth = TILE_SIZE * 0.25;
                ctx.strokeStyle = '#D4AF37';
                ctx.stroke();

                ctx.restore();

                drawHead(snake[0].x, snake[0].y);
            }
        }

        function drawClothing(x, y, type) {
            const cx = x * TILE_SIZE + TILE_SIZE/2;
            const cy = y * TILE_SIZE + TILE_SIZE/2;
            const size = TILE_SIZE * 0.7; 
            
            const pulse = 1 + Math.sin(frameCount * 0.1) * 0.05; 
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(pulse, pulse);
            
            ctx.shadowBlur = 20;
            ctx.shadowColor = type === 'shirt' ? 'rgba(196, 2, 51, 0.8)' : 'rgba(212, 175, 55, 0.8)';
            
            if (type === 'shirt') {
                ctx.fillStyle = '#111'; 
                ctx.strokeStyle = '#C40233'; 
                ctx.lineWidth = 2;
                
                ctx.beginPath();
                ctx.roundRect(-size/2.5, -size/2, size/1.25, size, 6); 
                ctx.roundRect(-size/1.5, -size/2, size/2, size/2.5, 4); 
                ctx.roundRect(size/4, -size/2, size/2, size/2.5, 4); 
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#C40233';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(-size/4, -size/2);
                ctx.lineTo(0, -size/4);
                ctx.lineTo(size/4, -size/2);
                ctx.fill();

            } else {
                ctx.fillStyle = '#222';
                ctx.strokeStyle = '#D4AF37';
                ctx.lineWidth = 2;
                
                ctx.beginPath();
                ctx.roundRect(-size/2.2, -size/2.2, size/1.1, size/3, 3); 
                ctx.roundRect(-size/2.2, -size/3, size/2.3, size/1.1, 4); 
                ctx.roundRect(size/16, -size/3, size/2.3, size/1.1, 4); 
                ctx.fill();
                ctx.stroke();
                
                ctx.fillStyle = '#D4AF37';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#D4AF37';
                ctx.beginPath();
                ctx.fillRect(-size/2.2, -size/2.2 + 4, size/1.1, 4);
            }

            ctx.restore();
        }

        function drawHead(x, y) {
            const cx = x * TILE_SIZE + TILE_SIZE/2;
            const cy = y * TILE_SIZE + TILE_SIZE/2;
            const size = TILE_SIZE * 0.55;

            let angle = 0;
            if (velocity.x === 1) angle = 0;
            else if (velocity.x === -1) angle = Math.PI;
            else if (velocity.y === 1) angle = Math.PI / 2;
            else if (velocity.y === -1) angle = -Math.PI / 2;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);

            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00C957';
            ctx.fillStyle = '#00C957';
            ctx.beginPath();
            ctx.ellipse(size * 0.2, 0, size, size * 0.8, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#D4AF37';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.ellipse(size * 0.6, 0, size * 0.4, size * 0.5, 0, -Math.PI/2, Math.PI/2);
            ctx.fill();
            
            const eyeX = size * 0.4;
            const eyeY = size * 0.45;
            
            ctx.fillStyle = '#C40233'; 
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0033';
            ctx.beginPath(); ctx.ellipse(eyeX, -eyeY, size*0.25, size*0.15, Math.PI/8, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(eyeX, eyeY, size*0.25, size*0.15, -Math.PI/8, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 0;
            ctx.beginPath(); ctx.ellipse(eyeX + 1, -eyeY, size*0.08, size*0.12, Math.PI/8, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(eyeX + 1, eyeY, size*0.08, size*0.12, -Math.PI/8, 0, Math.PI*2); ctx.fill();

            ctx.restore();
        }

        function handleInput(dir, e) {
            if(e) e.preventDefault();
            if(dir === 'up' && velocity.y === 0) nextVelocity = {x: 0, y: -1};
            if(dir === 'down' && velocity.y === 0) nextVelocity = {x: 0, y: 1};
            if(dir === 'left' && velocity.x === 0) nextVelocity = {x: -1, y: 0};
            if(dir === 'right' && velocity.x === 0) nextVelocity = {x: 1, y: 0};
        }

        window.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowUp': handleInput('up'); break;
                case 'ArrowDown': handleInput('down'); break;
                case 'ArrowLeft': handleInput('left'); break;
                case 'ArrowRight': handleInput('right'); break;
            }
        });

        let touchX = 0, touchY = 0;
        document.addEventListener('touchstart', e => {
            touchX = e.changedTouches[0].screenX;
            touchY = e.changedTouches[0].screenY;
        }, {passive: false});

        document.addEventListener('touchend', e => {
            let dx = e.changedTouches[0].screenX - touchX;
            let dy = e.changedTouches[0].screenY - touchY;
            if(Math.abs(dx) > Math.abs(dy)) {
                if(Math.abs(dx) > 20) handleInput(dx > 0 ? 'right' : 'left');
            } else {
                if(Math.abs(dy) > 20) handleInput(dy > 0 ? 'down' : 'up');
            }
        }, {passive: false});

    </script>
</body>
</html>
